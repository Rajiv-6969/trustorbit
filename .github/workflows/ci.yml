name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify + PostGIS Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Format check (Spotless)
        run: mvn -B -f backend/pom.xml spotless:check
      - name: Unit + integration tests
        run: mvn -B -f backend/pom.xml verify

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  compose-smoke:
    name: docker compose up smoke test
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - name: Start stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Hit the API
        run: |
          curl -fsS http://localhost:8080/api/status
          curl -fsS http://localhost:8080/actuator/health
      - name: Logs
        if: always()
        run: docker compose logs backend | tail -60
      - name: Stop
        if: always()
        run: docker compose down -v
