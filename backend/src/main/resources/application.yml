spring:
  application:
    name: trustorbit
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trustorbit}
    username: ${DATABASE_USER:trustorbit}
    password: ${DATABASE_PASSWORD:trustorbit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

trustorbit:
  cors:
    # Comma-separated origin patterns. Override with TRUSTORBIT_CORS_ALLOWED_ORIGINS in production.
    allowed-origins: ${TRUSTORBIT_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.vercel.app,https://*.netlify.app}
