# One-command local stack:  docker compose up --build
# - db:      PostgreSQL 16 + PostGIS 3.4
# - backend: Spring Boot API on http://localhost:8080 (Swagger: /swagger-ui.html)
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: trustorbit
      POSTGRES_USER: trustorbit
      POSTGRES_PASSWORD: trustorbit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustorbit -d trustorbit"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/trustorbit
      DATABASE_USER: trustorbit
      DATABASE_PASSWORD: trustorbit
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
