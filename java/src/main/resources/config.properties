# TrustOrbit settings. Edit and re-run; no code changes needed.

# ---- M1 ingestion ----
# A station is matched to the nearest satellite pixel only if it is within this distance.
ingestion.maxPixelDistanceKm=10
# Keep downloaded HDF5 files in data/raw after conversion (they are large; default: delete).
ingestion.keepRawFiles=false

# ---- M3 reliability score (filled in Phase 3) ----
# Weights for the 0-100 blend; they should add up to 1.0.
score.weight.completeness=0.15
score.weight.range=0.15
score.weight.anomaly=0.25
score.weight.drift=0.15
score.weight.crossSatellite=0.15
score.weight.neighbours=0.15

# Score bands
band.verified.min=85
band.acceptable.min=60
band.questionable.min=35

# ---- M4 alerts (filled in Phase 4) ----
alert.scoreBelow=35
