# Alternative host: Netlify (the default is Vercel – see vercel.json)
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every unknown path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
