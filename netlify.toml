# Alternative host: Netlify (the default host is Vercel – see website/vercel.json)
[build]
  base = "website"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: unknown paths serve index.html (data/ and reports/ are real files)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
